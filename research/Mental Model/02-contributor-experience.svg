<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rooted contributor experience</title>
  <desc id="desc">A contributor signs in with MFA, receives church capability authorization, develops a plan and draft manually or with optional AI, then a human reviews and approves before a worker publishes the approved revision.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#456b65"/></marker><style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#203b38}.title{font-size:28px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:14px}.box{fill:#f4f8f6;stroke:#668c82;stroke-width:2;rx:15}.ai{fill:#f1efff;stroke:#7d70a9;stroke-width:2;rx:15}.human{fill:#eaf5ef;stroke:#4d8667;stroke-width:2;rx:15}.decision{fill:#fff8e8;stroke:#b48b3e;stroke-width:2}.line{fill:none;stroke:#456b65;stroke-width:2.3;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1200" height="760" fill="#fff"/><text x="45" y="50" class="title">Contributor experience · prepare, review, publish</text>
  <rect x="50" y="100" width="200" height="78" class="box"/><text x="150" y="132" text-anchor="middle" class="label">Contributor sign-in</text><text x="150" y="156" text-anchor="middle" class="small">Fresh MFA assurance</text>
  <path d="M250 139H300" class="line"/><rect x="305" y="100" width="230" height="78" class="box"/><text x="420" y="132" text-anchor="middle" class="label">Church authorization</text><text x="420" y="156" text-anchor="middle" class="small">Active membership + capabilities</text>
  <path d="M535 139H585" class="line"/><rect x="590" y="100" width="240" height="78" class="box"/><text x="710" y="132" text-anchor="middle" class="label">Workspace</text><text x="710" y="156" text-anchor="middle" class="small">Sources · series · calendar · drafts</text>
  <path d="M710 178V230" class="line"/><rect x="565" y="235" width="290" height="84" class="box"/><text x="710" y="269" text-anchor="middle" class="label">Choose source and make plan</text><text x="710" y="294" text-anchor="middle" class="small">Manual authoring or guided workflow</text>
  <path d="M710 319V365" class="line"/><polygon points="710,365 785,420 710,475 635,420" class="decision"/><text x="710" y="415" text-anchor="middle" class="small">Use AI</text><text x="710" y="435" text-anchor="middle" class="small">assistance?</text>
  <path d="M635 420H450V485" class="line"/><text x="520" y="407" class="small">Yes</text><rect x="300" y="490" width="300" height="86" class="ai"/><text x="450" y="522" text-anchor="middle" class="label">Review source and intent</text><text x="450" y="547" text-anchor="middle" class="small">AI proposes; contributor confirms</text>
  <path d="M785 420H965V485" class="line"/><text x="865" y="407" class="small">No</text><rect x="820" y="490" width="290" height="86" class="box"/><text x="965" y="522" text-anchor="middle" class="label">Write and edit manually</text><text x="965" y="547" text-anchor="middle" class="small">Contributor controls the draft</text>
  <path d="M450 576V610H710" class="line"/><path d="M965 576V610H710" class="line"/><rect x="565" y="615" width="290" height="70" class="box"/><text x="710" y="644" text-anchor="middle" class="label">Submit revision for review</text><text x="710" y="667" text-anchor="middle" class="small">Approval is tied to this revision</text>
  <path d="M855 650H900" class="line"/><rect x="905" y="615" width="250" height="70" class="human"/><text x="1030" y="644" text-anchor="middle" class="label">Human approves</text><text x="1030" y="667" text-anchor="middle" class="small">Schedule this revision</text>
  <path d="M1030 685V692" class="line"/><rect x="905" y="698" width="250" height="48" class="box"/><text x="1030" y="728" text-anchor="middle" class="label">Worker publishes on schedule</text>
</svg>

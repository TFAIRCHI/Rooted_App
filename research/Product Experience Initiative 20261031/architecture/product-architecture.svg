<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" role="img" aria-labelledby="title desc"><title id="title">Rooted unified product architecture</title><desc id="desc">A channel source library imports many formats into scoped context for one semantic document with Write and Design views. Exact review precedes publication and member rendering. Public decks have separate approval. Homepage muted autoplay and future identity integration remain distinct responsibilities.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#24785e"/></marker></defs><rect width="1800" height="1220" fill="#f6f4eb"/><text x="55" y="48" font-size="14" font-family="Arial" letter-spacing="3" fill="#24785e">ROOTED · RESEARCH REBUILT NOVEMBER 1, 2026</text><text x="55" y="99" font-size="40" font-family="Georgia" fill="#153b43">Broad context. One flexible creator. Faithful reading.</text><text x="55" y="136" font-size="18" font-family="Arial" fill="#435c60">Logical responsibilities proposed for review. No application, provider account or production resources changed.</text>
<g><rect x="55" y="175" width="1690" height="100" rx="15" fill="#e3eadf" stroke="#b6c8bd"/><text x="77" y="210" font-size="23" font-family="Georgia" fill="#153b43">Preserve authorization and exact publication integrity</text><text x="77" y="239" font-size="16" font-family="Arial" fill="#435c60">Verified identity + church/private scope · immutable revisions · bounded jobs/fetching · exact-hash review · explicit publication</text></g>
<g><rect x="55" y="320" width="500" height="140" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="77" y="355" font-size="23" font-family="Georgia" fill="#153b43">Channel source library + ONE Import</text><text x="77" y="384" font-size="16" font-family="Arial" fill="#435c60">Files / links / paste / consented connections</text><text x="77" y="408" font-size="16" font-family="Arial" fill="#435c60">Named rows: processing / ready / error + coverage</text><text x="77" y="432" font-size="16" font-family="Arial" fill="#435c60">Broad capability registry; only tested adapters enabled</text></g>
<g><rect x="55" y="500" width="500" height="140" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="77" y="535" font-size="23" font-family="Georgia" fill="#153b43">Versioned context and retrieval</text><text x="77" y="564" font-size="16" font-family="Arial" fill="#435c60">Bounded extraction / OCR / transcription / indexing</text><text x="77" y="588" font-size="16" font-family="Arial" fill="#435c60">Selected ready versions; tenant filter before ranking</text><text x="77" y="612" font-size="16" font-family="Arial" fill="#435c60">Immutable evidence spans, citations and source manifest</text></g>
<path d="M305 460 L305 500" stroke="#24785e" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="610" y="320" width="620" height="510" rx="18" fill="#e3eadf" stroke="#8eae9a" stroke-width="2"/>
<text x="635" y="362" font-size="27" font-family="Georgia" fill="#153b43">ONE Compose workspace</text><text x="635" y="394" font-size="17" font-family="Arial" fill="#435c60">One semantic document + layout + history + save state</text>
<g><rect x="635" y="420" width="270" height="145" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="657" y="455" font-size="23" font-family="Georgia" fill="#153b43">Write</text><text x="657" y="484" font-size="16" font-family="Arial" fill="#435c60">Rich text + selection</text><text x="657" y="508" font-size="16" font-family="Arial" fill="#435c60">Outline / direct edits</text><text x="657" y="532" font-size="16" font-family="Arial" fill="#435c60">Source-grounded assistant</text></g>
<g><rect x="930" y="420" width="275" height="145" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="952" y="455" font-size="23" font-family="Georgia" fill="#153b43">Design</text><text x="952" y="484" font-size="16" font-family="Arial" fill="#435c60">Objects / layers / crop</text><text x="952" y="508" font-size="16" font-family="Arial" fill="#435c60">Position / group / align</text><text x="952" y="532" font-size="16" font-family="Arial" fill="#435c60">Same nodes; reading order</text></g>
<g><rect x="635" y="590" width="570" height="110" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="657" y="625" font-size="23" font-family="Georgia" fill="#153b43">Selected AI and media operations</text><text x="657" y="654" font-size="16" font-family="Arial" fill="#435c60">Preview → Apply / Reject → Undo; version-aware atomic edits</text><text x="657" y="678" font-size="16" font-family="Arial" fill="#435c60">Bounded text / image / data / video tools; no forced handoff</text></g>
<g><rect x="635" y="725" width="570" height="80" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="657" y="760" font-size="23" font-family="Georgia" fill="#153b43">Protected review conversation</text><text x="657" y="789" font-size="16" font-family="Arial" fill="#435c60">Visible request/reply + exact revision + repeated cycles</text></g>
<path d="M555 570 L610 570" stroke="#24785e" stroke-width="3" fill="none" marker-end="url(#a)"/>
<g><rect x="1285" y="320" width="460" height="140" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="1307" y="355" font-size="23" font-family="Georgia" fill="#153b43">Approved publication snapshot</text><text x="1307" y="384" font-size="16" font-family="Arial" fill="#435c60">Content + layout + assets + template version</text><text x="1307" y="408" font-size="16" font-family="Arial" fill="#435c60">Shared preview/member renderer</text><text x="1307" y="432" font-size="16" font-family="Arial" fill="#435c60">Phone reflow + alternatives + narration order</text></g>
<g><rect x="1285" y="510" width="460" height="125" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="1307" y="545" font-size="23" font-family="Georgia" fill="#153b43">Public deck rendition</text><text x="1307" y="574" font-size="16" font-family="Arial" fill="#435c60">Separate public approval + brand/caption/link</text><text x="1307" y="598" font-size="16" font-family="Arial" fill="#435c60">Reuse layout primitives, exclude private data</text><text x="1307" y="622" font-size="16" font-family="Arial" fill="#435c60">Member preview / opt-in / download fallback</text></g>
<g><rect x="1285" y="685" width="460" height="125" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="1307" y="720" font-size="23" font-family="Georgia" fill="#153b43">Asset / rendition jobs</text><text x="1307" y="749" font-size="16" font-family="Arial" fill="#435c60">Durable private media; idempotent and bounded</text><text x="1307" y="773" font-size="16" font-family="Arial" fill="#435c60">Stale results cannot overwrite new work</text><text x="1307" y="797" font-size="16" font-family="Arial" fill="#435c60">Providers need actual quality/cost/rights tests</text></g>
<path d="M1230 765 H1255 V390 H1285" fill="none" stroke="#24785e" stroke-width="3" marker-end="url(#a)"/><path d="M1515 460 L1515 510" stroke="#24785e" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1285 745 L1230 745" stroke="#24785e" stroke-width="3" fill="none" marker-end="url(#a)"/>
<g><rect x="55" y="690" width="500" height="140" rx="15" fill="#fffefa" stroke="#b6c8bd"/><text x="77" y="725" font-size="23" font-family="Georgia" fill="#153b43">Homepage AI-tab recording</text><text x="77" y="754" font-size="16" font-family="Arial" fill="#435c60">Visible first viewport; muted inline autostart</text><text x="77" y="778" font-size="16" font-family="Arial" fill="#435c60">Pause + transcript + preference/policy fallback</text><text x="77" y="802" font-size="16" font-family="Arial" fill="#435c60">Research sample now; genuine release recording later</text></g>
<g><rect x="55" y="880" width="1690" height="245" rx="15" fill="#e9e3ef" stroke="#b6c8bd"/><text x="77" y="915" font-size="23" font-family="Georgia" fill="#153b43">Member access is a separate boundary</text><text x="77" y="944" font-size="16" font-family="Arial" fill="#435c60">QR carries church/return context → verified credential → explicit church enrollment policy → intended reader</text><text x="77" y="968" font-size="16" font-family="Arial" fill="#435c60">Phone-first provider + recovery + stable principal links remain conditional; preserve staff assurance</text><text x="77" y="992" font-size="16" font-family="Arial" fill="#435c60">Future Planning Center People sync is separately authorized candidate association, not authentication</text><text x="77" y="1016" font-size="16" font-family="Arial" fill="#435c60">Private source files, staff discussion and directory records never become public deck or default reading context</text></g>
<text x="55" y="1175" font-family="Arial" font-size="17" fill="#435c60">Local prototype/model checks are bounded evidence. Rich editor integration, live adapters, durable assets and real church usability are future gates.</text></svg>
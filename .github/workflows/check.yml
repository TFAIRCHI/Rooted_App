name: Application checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gather_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gather_runtime:gather_local_development@127.0.0.1:54329/gather_test
      MIGRATION_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:54329/gather_test
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:54329/gather_test
      RUNTIME_DATABASE_PASSWORD: gather_local_development
      EXTERNAL_SERVICES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
